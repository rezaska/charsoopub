name: Build

# The build job always runs, so pull requests are checked too. Deploying to
# GitHub Pages is gated behind the DEPLOY_TARGET variable, which is set — see
# "Pages is on" in docs/cms.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # postinstall vendors the Sveltia CMS bundle into public/admin/cms/
      - run: npm ci

      # Project Pages serves from /<repo>/, so the same source is built under
      # that sub-path. Drop both vars once charsoo-mag.ir points here.
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.DEPLOY_TARGET == 'pages' && '/charsoopub' || '/' }}
          SITE_URL: ${{ vars.DEPLOY_TARGET == 'pages' && 'https://rezaska.github.io' || 'https://charsoo-mag.ir' }}

      - name: Check the build produced what we expect
        run: |
          test -f dist/index.html
          test -f dist/admin/index.html
          test -f dist/admin/config.yml
          test -f dist/admin/guide/index.html
          test -f dist/admin/cms/sveltia-cms.js
          test -f dist/sitemap-index.xml
          ! grep -q '/admin' dist/sitemap-0.xml
          test "$(find dist -name 'index.html' | wc -l)" -ge 30
          echo "pages built: $(find dist -name 'index.html' | wc -l)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    # Gated on the repository variable DEPLOY_TARGET being "pages", which it
    # is. Clearing it (Settings → Secrets and variables → Actions → Variables)
    # stops deploying and leaves the build job as plain CI.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_TARGET == 'pages'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
